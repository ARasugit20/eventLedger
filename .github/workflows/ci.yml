name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check app tests analytics scripts

      - name: Run tests with coverage
        run: pytest -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=75

  lineage-guard-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run reusable lineage guard action (offline report)
        uses: ARasugit20/Model-Lineage-Guard/.github/actions/lineage-guard-gate@main
        with:
          mode: offline
          output-dir: out/mlguard

      - name: Verify --fail-on high blocks with exit code 3
        uses: ARasugit20/Model-Lineage-Guard/.github/actions/lineage-guard-gate@main
        with:
          mode: offline
          output-dir: out/mlguard-gate
          verify-gate: "true"
